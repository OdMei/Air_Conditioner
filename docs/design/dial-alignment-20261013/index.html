</style><main><h1>F表盘：让数字与单位成为一组读数</h1><p>真实 LVGL 渲染对比。252px紧凑结构、加减调温与其他功能保留；右侧读数为PC模拟数据。</p><div class="toolbar"><button data-version="before" aria-pressed="false">旧版</button><button data-version="after" aria-pressed="true">微调版</button><span id="state">当前：微调版</span></div><figure><img id="preview" src="../../images/ui-options-20261013/native-dial-aligned-home.png" alt="F表盘数字与单位对齐后的原生LVGL主页"><figcaption id="caption">主数字96字号，单位32字号；共享基线、整组居中，读数下移8像素。</figcaption></figure><div class="notes"><div><b>清楚的字号层级</b><span>主数字保持突出，单位更易读。</span></div><div><b>完整的一组读数</b><span>收紧间距，按实际文字宽度居中。</span></div><div><b>一致的动态反馈</b><span>数字与单位共同移动，动画保持对齐。</span></div></div><p class="footer">本页只展示实际截图，交互功能请在VS Code的LVGL预览窗口中体验。新版尚未烧录。</p></main><script>
const assets={before:'native-v9_4_home.png',after:'native-dial-aligned-home.png'};const descriptions={before:'旧版：主数字96字号，单位20字号；单位比数字基线高约11像素。',after:'主数字96字号，单位32字号；共享基线、整组居中，读数下移8像素。'};document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{let version=button.dataset.version;document.getElementById('preview').src='../../images/ui-options-20261013/'+assets[version];document.getElementById('caption').textContent=descriptions[version];document.getElementById('state').textContent='当前：'+button.textContent;document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));
</script></html>
